<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnWord - 轻量级英语词汇高效学习工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- 引入 AOS 动画库 -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- 引入 Typed.js 库用于打字效果 -->
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <!-- 引入 Marked.js 用于解析 Markdown 更新日志 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 LeanCloud JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --primary: #0078d7;
            --primary-hover: #339af0;
            --bg-body: #050811;
            --text-title: #ffffff;
            --text-nav: #94a3b8;
            --text-main: #94a3b8;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --grid-color: rgba(255, 255, 255, 0.03);
            --nav-bg: rgba(5, 8, 17, 0.7);
            --mock-bg: rgba(15, 23, 42, 0.65);
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        /* 设置全局平滑滚动边距 */
        html { scroll-padding-top: 80px; }

        .light-theme {
            --bg-body: #f8fafc;
            --text-title: #0f172a;
            --text-nav: #1e293b;
            --text-main: #0f172a;
            --text-muted: #334155;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 120, 215, 0.15);
            --grid-color: rgba(0, 120, 215, 0.08);
            --nav-bg: rgba(248, 250, 252, 0.95);
            --mock-bg: #ffffff;
            --input-bg: #f1f5f9;
        }

        body {
            font-family: 'Inter', 'MiSans', -apple-system, sans-serif;
            overflow-x: hidden;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        h1, h2, h3, h4 { color: var(--text-title); transition: color 0.5s ease; }
        b { color: var(--text-title); transition: color 0.5s ease; }

        .typed-cursor { color: var(--primary); font-size: 0.9em; margin-left: 5px; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(1deg); }
            50% { transform: translateY(-15px) rotate(0deg); }
            100% { transform: translateY(0px) rotate(1deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .hero-gradient {
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.5) 0%, var(--bg-body) 70%);
            transition: background 0.5s ease;
        }
        .light-theme .hero-gradient {
            background: radial-gradient(circle at center, rgba(0, 120, 215, 0.05) 0%, var(--bg-body) 80%);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .grid-pattern {
            background-image: radial-gradient(var(--grid-color) 1px, transparent 0);
            background-size: 50px 50px;
        }

        .nav-blur {
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.5s ease;
        }

        .content-container {
            max-width: 72rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* 神经网络背景画布样式 */
        #neural-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            filter: blur(0.5px);
            opacity: 0.8;
            transform: translateZ(0);
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- Header -->
    <header class="fixed w-full z-50 nav-blur">
        <nav class="content-container py-4 lg:py-5 flex justify-between items-center">
            <div class="flex items-center space-x-3 group cursor-pointer" id="logo-btn">
                <div class="bg-blue-600 p-2 rounded-xl group-hover:rotate-12 transition-transform shadow-lg shadow-blue-500/20 text-white">
                    <i class="fas fa-book-open text-lg lg:text-xl"></i>
                </div>
                <span class="text-xl lg:text-2xl font-bold tracking-tighter transition-colors" style="color: var(--text-title)">LearnWord</span>
            </div>

            <!-- Desktop Links -->
            <div class="hidden md:flex space-x-10 text-sm font-medium items-center">
                <a href="#methodology" class="nav-link hover:text-blue-400 transition-colors" style="color: var(--text-nav)">核心逻辑</a>
                <a href="#detailed-features" class="nav-link hover:text-blue-400 transition-colors" style="color: var(--text-nav)">模块详解</a>
                <a href="#changelog" class="nav-link hover:text-blue-400 transition-colors" style="color: var(--text-nav)">版本记录</a>
                <!-- 用户状态区域 -->
                <div id="nav-user-info" class="flex items-center">
                    <a id="nav-auth-link" href="./register.html" class="nav-link hover:text-blue-400 transition-colors font-bold flex items-center" style="color: var(--text-nav)">
                        <i class="fas fa-user-circle mr-2"></i>注册/登录
                    </a>
                </div>
            </div>

            <div class="flex items-center space-x-3 lg:space-x-5">
                <button id="theme-toggle" class="p-2.5 rounded-xl glass-card hover:bg-blue-600/10 transition-colors text-blue-500" title="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="https://github.com/Junpgle/LearnWord/releases" class="download-link hidden sm:block bg-blue-600 hover:bg-blue-500 text-white px-5 lg:px-7 py-2 lg:py-2.5 rounded-full text-xs lg:text-sm font-bold transition-all shadow-lg shadow-blue-600/30">
                    Windows 下载
                </a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero-gradient pt-32 lg:pt-56 pb-20 lg:pb-40 relative grid-pattern overflow-hidden">
        <canvas id="neural-bg"></canvas>

        <div class="content-container flex flex-col lg:flex-row items-center relative z-10">
            <div class="lg:w-1/2 mb-16 lg:mb-0 text-center lg:text-left" data-aos="fade-right">
                <div id="version-badge" class="inline-block px-4 py-1.5 mb-6 lg:mb-8 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-500 text-[10px] lg:text-xs font-bold tracking-widest uppercase">
                    v1.2.4 STABLE NOW AVAILABLE
                </div>
                <h1 class="text-4xl sm:text-5xl lg:text-7xl font-extrabold leading-[1.15] mb-8 tracking-tight">
                    掌握单词<br><span id="typed-text" class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500"></span>
                </h1>

                <!-- 学习状态卡片 (仅登录后可见) -->
                <div id="hero-study-card" class="hidden mb-10 p-6 rounded-2xl glass-card border-blue-500/20 text-left max-w-sm mx-auto lg:mx-0">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-blue-500 uppercase tracking-widest">当前进度</span>
                        <span id="hero-wordlist-name" class="text-xs text-slate-400 italic">CET4 词库</span>
                    </div>
                    <div class="text-3xl font-black mb-2" style="color: var(--text-title)">
                        <span id="hero-learned-count">0</span> <span class="text-sm font-normal text-slate-500">/ <span id="hero-total-count">0</span> 词</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                        <div id="hero-progress-bar" class="h-full bg-blue-600 transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>

                <p id="hero-desc" class="text-base lg:text-xl mb-10 lg:mb-12 max-w-md mx-auto lg:mx-0 leading-relaxed" style="color: var(--text-main)">
                    基于科学的三阶段记忆法，将繁琐的背词过程转化为阶段式的成就挑战。轻量、纯净、开源。
                </p>

                <div class="flex flex-col sm:flex-row flex-wrap items-center lg:items-stretch justify-center lg:justify-start gap-4 lg:gap-5">
                    <a href="https://github.com/Junpgle/LearnWord/releases" class="download-link w-full sm:w-auto bg-blue-600 text-white px-8 lg:px-10 py-4 rounded-2xl font-bold hover:bg-blue-700 transition shadow-2xl shadow-blue-600/20 flex items-center justify-center">
                        <i class="fab fa-windows mr-3 text-lg lg:text-xl"></i>Windows 下载
                    </a>
                    <a id="hero-auth-btn" href="./register.html" class="glass-card flex-1 sm:flex-none px-6 lg:px-8 py-4 rounded-2xl font-bold hover:bg-blue-600/10 transition flex items-center justify-center border-white/10" style="color: var(--text-title)">
                        <i class="fas fa-sync-alt mr-2 text-lg"></i>云端注册/同步
                    </a>
                </div>
            </div>

            <div class="lg:w-1/2 relative flex justify-center lg:justify-end" data-aos="zoom-in">
                <!-- 模拟界面略 -->
                <div class="relative w-full max-w-[320px] sm:max-w-md glass-card rounded-3xl p-6 animate-float shadow-2xl">
                     <div class="text-center py-10">
                         <i class="fas fa-brain text-5xl text-blue-500 mb-6"></i>
                         <p class="text-slate-400 italic">科学阶梯记忆，从这里开始</p>
                     </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-16 border-t border-white/5 text-center">
        <p class="text-xs text-slate-500">© 2025 LearnWord Project. Designed by Junpgle.</p>
    </footer>

    <script>
        // --- 1. 配置与初始化 ---
        const APP_ID = "5wPsbnakcoOjfaPzfC44vfW5-gzGzoHsz";
        const APP_KEY = "j9qbdfjiJAPsqbGUy04COFTD";
        const SERVER_URL = "https://5wpsbnak.lc-cn-n1-shared.com";

        AV.init({ appId: APP_ID, appKey: APP_KEY, serverURL: SERVER_URL });

        // --- 2. 核心状态同步逻辑 ---
        async function syncLoginStatus() {
            const currentUser = AV.User.current();
            if (currentUser) {
                try {
                    // 刷新获取最新字段
                    await currentUser.fetch();

                    const username = currentUser.getUsername();
                    const wordlistName = currentUser.get('wordlistName') || '暂无词库';
                    const learned = currentUser.get('learnedCount') || 0;
                    const total = currentUser.get('totalCount') || 0;
                    const progress = total > 0 ? (learned / total * 100) : 0;

                    // 1. 更新导航栏
                    const navAuthLink = document.getElementById('nav-auth-link');
                    if (navAuthLink) {
                        navAuthLink.innerHTML = `
                            <div class="flex items-center space-x-2 bg-blue-600/10 px-3 py-1.5 rounded-lg border border-blue-500/20 text-blue-500">
                                <i class="fas fa-user-circle"></i>
                                <span>${username}</span>
                            </div>
                        `;
                    }

                    // 2. 显示学习状态卡片
                    document.getElementById('hero-study-card').classList.remove('hidden');
                    document.getElementById('hero-desc').classList.add('hidden');
                    document.getElementById('hero-wordlist-name').innerText = wordlistName;
                    document.getElementById('hero-learned-count').innerText = learned;
                    document.getElementById('hero-total-count').innerText = total;
                    document.getElementById('hero-progress-bar').style.width = `${progress}%`;

                    // 3. 修改 Hero 按钮
                    const heroAuthBtn = document.getElementById('hero-auth-btn');
                    if (heroAuthBtn) {
                        heroAuthBtn.innerHTML = '<i class="fas fa-chart-pie mr-2 text-lg"></i>数据中心';
                        heroAuthBtn.classList.add('bg-blue-600', 'text-white');
                    }
                } catch (e) {
                    console.error("Sync Error:", e);
                }
            }
        }

        // --- 3. UI 效果逻辑 ---
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 1000, once: true });
            syncLoginStatus();

            new Typed('#typed-text', {
                strings: ['从未如此高效', '竟然如此简单', '只需三个阶段'],
                typeSpeed: 80, backSpeed: 50, loop: true
            });
        });

        // 神经网络背景简单版
        const canvas = document.getElementById('neural-bg');
        const ctx = canvas.getContext('2d');
        function initBg() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = "rgba(0, 120, 215, 0.05)";
            for(let i=0; i<20; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
        }
        window.addEventListener('resize', initBg);
        initBg();

        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.onclick = () => {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        };
    </script>
</body>
</html>
